<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - QuickLearn AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .brand {
      font-size: 26px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 25px;
      text-decoration: none;
    }

    .auth-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    p.auth-sub {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .bottom-link {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }

    .bottom-link a {
      color: #38bdf8;
      text-decoration: none;
    }

    .bottom-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <a href="index.html" class="brand">QuickLearn AI</a>

  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="auth-sub">Enter your details to access your study hub</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="student@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="bottom-link">
      Don't have an account? <a href="#" onclick="alert('Signup page is next!')">Create account</a>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      // Temporary simulated redirect until we wire Firebase
      alert("Login successful! Redirecting to Dashboard...");
      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
