<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards - QuickLearn AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
    }

    aside {
      width: 240px;
      background-color: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 32px;
      padding-left: 8px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }

    nav a.active, nav a:hover {
      background-color: #0f172a;
      color: #38bdf8;
    }

    .logout-btn {
      color: #ef4444;
      text-decoration: none;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ef444433;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 36px 40px;
      overflow-y: auto;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-bar {
      width: 100%;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
    }

    .card-scene {
      width: 100%;
      height: 290px;
      perspective: 1000px;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
    }

    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid #334155;
    }

    .card-front {
      background-color: #1e293b;
      color: #f8fafc;
    }

    .card-back {
      background-color: #082f49;
      border-color: #38bdf8;
      color: #e0f2fe;
      transform: rotateY(180deg);
    }

    .tag {
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 14px;
    }

    .card-text {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
    }

    .hint {
      font-size: 13px;
      color: #64748b;
      margin-top: 18px;
    }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }

    .btn-ctrl {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-ctrl:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .card-counter {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-master {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-master:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <aside>
    <div class="brand">QuickLearn AI</div>
    <nav>
      <a href="dashboard.html">📊 Overview</a>
      <a href="upload.html">📤 Upload Notes</a>
      <a href="quiz.html">📝 AI Quiz</a>
      <a href="flashcards.html" class="active">⚡ Flashcards</a>
    </nav>
    <a href="index.html" class="logout-btn">Log Out</a>
  </aside>

  <main>
    <div class="header-bar">
      <h1>Active-Recall Flashcards</h1>
      <p class="subtitle" id="flashSubtitle">Generating flashcards from your active notes...</p>
    </div>

    <!-- 3D Spatial Flip Card -->
    <div class="card-scene" onclick="flipCard()">
      <div class="card-inner" id="cardElement">
        <div class="card-face card-front">
          <div class="tag">CONCEPT / TOPIC</div>
          <div class="card-text" id="frontText">Loading notes...</div>
          <div class="hint">Click to flip and reveal answer ↻</div>
        </div>
        <div class="card-face card-back">
          <div class="tag">EXPLANATION & DETAILS</div>
          <div class="card-text" id="backText">Loading explanation...</div>
          <div class="hint">Click to flip back ↺</div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn-ctrl" onclick="prevCard()">← Previous</button>
      <span class="card-counter" id="counterDisplay">1 of 1</span>
      <button class="btn-ctrl" onclick="nextCard()">Next →</button>
    </div>

    <button class="btn-master" onclick="markMastered()">✓ Mark as Mastered</button>
  </main>

  <script>
    let flashcards = [];
    let currentIndex = 0;

    // Dynamically cuts clauses and definitions from any input note
    function parseDynamicFlashcards(text) {
      const clauses = text
        .split(/[.;\n]+/)
        .map(s => s.trim())
        .filter(s => s.length > 18);

      if (clauses.length === 0) {
        return [{ front: "Active Study Concept", back: text }];
      }

      return clauses.map((clause) => {
        const match = clause.match(/^(.+?)\s+(is|are|means|refers to|defines|uses|guarantees|:)\s+(.+)$/i);
        if (match) {
          return {
            front: match[1].trim() + "?",
            back: `${match[2].toUpperCase()}: ${match[3].trim()}`
          };
        } else {
          const words = clause.split(/\s+/);
          const frontPart = words.slice(0, 4).join(" ");
          const backPart = words.slice(4).join(" ");
          return {
            front: `Concept: ${frontPart}...`,
            back: backPart || clause
          };
        }
      });
    }

    async function loadFlashcards() {
      const currentNotes = localStorage.getItem("studyText") || "Data Structures, Database Schemas, and Process Scheduling.";

      try {
        const response = await fetch("http://localhost:3000/api/flashcards", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: currentNotes })
        });
        if (!response.ok) throw new Error();
        flashcards = await response.json();
      } catch (err) {
        flashcards = parseDynamicFlashcards(currentNotes);
      }

      document.getElementById("flashSubtitle").innerText = `Created from your active notes (${flashcards.length} cards)`;
      currentIndex = 0;
      updateCardUI();
    }

    function flipCard() {
      document.getElementById("cardElement").classList.toggle("is-flipped");
    }

    function updateCardUI() {
      if (!flashcards.length) return;
      document.getElementById("cardElement").classList.remove("is-flipped");

      setTimeout(() => {
        document.getElementById("frontText").innerText = flashcards[currentIndex].front;
        document.getElementById("backText").innerText = flashcards[currentIndex].back;
        document.getElementById("counterDisplay").innerText = `${currentIndex + 1} of ${flashcards.length}`;
      }, 150);
    }

    function nextCard() {
      if (currentIndex < flashcards.length - 1) {
        currentIndex++;
        updateCardUI();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCardUI();
      }
    }

    function markMastered() {
      let count = parseInt(localStorage.getItem("cardsMastered") || "0", 10);
      localStorage.setItem("cardsMastered", count + 1);
      alert("Card marked as mastered! Added to your dashboard stats.");
      nextCard();
    }

    window.onload = loadFlashcards;
  </script>
</body>
</html>
