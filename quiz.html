<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Quiz - QuickLearn AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
    }

    aside {
      width: 240px;
      background-color: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 32px;
      padding-left: 8px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }

    nav a.active, nav a:hover {
      background-color: #0f172a;
      color: #38bdf8;
    }

    .logout-btn {
      color: #ef4444;
      text-decoration: none;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ef444433;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 36px 40px;
      overflow-y: auto;
      max-width: 900px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      color: #38bdf8;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .opt-btn {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: #38bdf8;
      background-color: #1e293b;
    }

    .opt-btn.correct {
      background-color: #064e3b;
      border-color: #10b981;
      color: #a7f3d0;
    }

    .opt-btn.wrong {
      background-color: #7f1d1d;
      border-color: #ef4444;
      color: #fecaca;
    }

    .explanation-box {
      display: none;
      background-color: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 14px 18px;
      border-radius: 4px;
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .nav-controls {
      display: flex;
      justify-content: flex-end;
    }

    .btn-next {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .result-box {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      margin: 0 auto 20px;
      color: #38bdf8;
    }

    .btn-restart {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px 6px;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <aside>
    <div class="brand">QuickLearn AI</div>
    <nav>
      <a href="dashboard.html">📊 Overview</a>
      <a href="upload.html">📤 Upload Notes</a>
      <a href="quiz.html" class="active">📝 AI Quiz</a>
      <a href="flashcards.html">⚡ Flashcards</a>
    </nav>
    <a href="index.html" class="logout-btn">Log Out</a>
  </aside>

  <main>
    <h1>AI-Generated Practice Quiz</h1>
    <p class="subtitle" id="quizSubtitle">Synthesizing practice questions from your active notes...</p>

    <div class="card" id="quizCard">
      <div class="q-meta">
        <span id="questionCounter">Question 1 of 5</span>
        <span id="scoreCounter">Score: 0</span>
      </div>

      <div class="question-text" id="questionText">Generating questions...</div>

      <div class="options" id="optionsContainer"></div>

      <div class="explanation-box" id="explanationBox"></div>

      <div class="nav-controls">
        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>

    <!-- Final Results Box -->
    <div class="card result-box" id="resultBox">
      <div class="score-circle" id="finalScore">0/0</div>
      <h2 style="margin-bottom: 8px;">Great Effort! 🎉</h2>
      <p style="color: #94a3b8; margin-bottom: 24px;" id="resultMessage">You have completed the quiz.</p>
      <button class="btn-restart" onclick="restartQuiz()">Retake Quiz</button>
      <a href="flashcards.html" class="btn-restart" style="background-color: #0f172a; color: #38bdf8; border: 1px solid #38bdf8;">Study Flashcards →</a>
    </div>
  </main>

  <script>
    let questions = [];
    let currentIndex = 0;
    let score = 0;

    // Dynamically builds questions from any provided note content
    function createDynamicQuestions(text) {
      const sentences = text
        .split(/[.?!]\s+/)
        .map(s => s.trim())
        .filter(s => s.length > 20);

      if (sentences.length === 0) {
        return [
          {
            question: `What is the core focus of your uploaded note?`,
            options: [text.slice(0, 35) + "...", "System Design", "Algorithms", "General Principles"],
            answer: 0,
            explanation: `Derived from your input: ${text.slice(0, 80)}...`
          }
        ];
      }

      const generated = [];

      sentences.slice(0, 5).forEach((sentence, idx) => {
        const words = sentence.split(/\s+/).filter(w => w.length > 4 && !/^(which|where|their|there|about|these|those)/i.test(w));
        const chosen = words[Math.floor(words.length / 2)] || "concept";
        const cleanWord = chosen.replace(/[^a-zA-Z0-9]/g, "");
        const blanked = sentence.replace(new RegExp(cleanWord, "i"), "_______");

        const distractors = [
          cleanWord,
          "Variable " + (idx + 1),
          "Secondary property",
          "External parameter"
        ].sort(() => Math.random() - 0.5);

        generated.push({
          question: `According to your current note: "${blanked}" — What belongs in the blank?`,
          options: distractors,
          answer: distractors.indexOf(cleanWord),
          explanation: `Context from your note: "${sentence}."`
        });
      });

      return generated;
    }

    async function loadQuiz() {
      const currentNotes = localStorage.getItem("studyText") || "Database Management Systems and Operating Systems.";

      try {
        const response = await fetch("http://localhost:3000/api/quiz", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: currentNotes })
        });
        if (!response.ok) throw new Error();
        questions = await response.json();
      } catch (err) {
        questions = createDynamicQuestions(currentNotes);
      }

      document.getElementById("quizSubtitle").innerText = `Generated from your active notes (${questions.length} questions)`;
      currentIndex = 0;
      score = 0;
      displayQuestion();
    }

    function displayQuestion() {
      if (!questions.length) return;
      const q = questions[currentIndex];

      document.getElementById("questionCounter").innerText = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById("scoreCounter").innerText = `Score: ${score}`;
      document.getElementById("questionText").innerText = q.question;

      const optsBox = document.getElementById("optionsContainer");
      optsBox.innerHTML = "";

      const expBox = document.getElementById("explanationBox");
      expBox.style.display = "none";
      expBox.innerText = "";

      document.getElementById("nextBtn").style.display = "none";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optsBox.appendChild(btn);
      });
    }

    function selectOption(selectedIdx) {
      const q = questions[currentIndex];
      const buttons = document.querySelectorAll(".opt-btn");
      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === q.answer) {
        buttons[selectedIdx].classList.add("correct");
        score++;
        document.getElementById("scoreCounter").innerText = `Score: ${score}`;
      } else {
        buttons[selectedIdx].classList.add("wrong");
        if (buttons[q.answer]) buttons[q.answer].classList.add("correct");
      }

      const expBox = document.getElementById("explanationBox");
      expBox.innerText = "💡 Note Context: " + q.explanation;
      expBox.style.display = "block";
      document.getElementById("nextBtn").style.display = "inline-block";
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) {
        displayQuestion();
      } else {
        document.getElementById("quizCard").style.display = "none";
        const resultBox = document.getElementById("resultBox");
        resultBox.style.display = "block";
        document.getElementById("finalScore").innerText = `${score}/${questions.length}`;
        document.getElementById("resultMessage").innerText = `You scored ${score} out of ${questions.length} (${Math.round((score / questions.length) * 100)}%)!`;

        let count = parseInt(localStorage.getItem("quizzesCompleted") || "0", 10);
        localStorage.setItem("quizzesCompleted", count + 1);
      }
    }

    function restartQuiz() {
      document.getElementById("resultBox").style.display = "none";
      document.getElementById("quizCard").style.display = "block";
      currentIndex = 0;
      score = 0;
      displayQuestion();
    }

    window.onload = loadQuiz();
  </script>
</body>
</html>
