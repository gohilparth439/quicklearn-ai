<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Quiz - QuickLearn AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar Navigation */
    aside {
      width: 240px;
      background-color: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 32px;
      padding-left: 8px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }

    nav a.active, nav a:hover {
      background-color: #0f172a;
      color: #38bdf8;
    }

    .logout-btn {
      color: #ef4444;
      text-decoration: none;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ef444433;
      text-align: center;
    }

    /* Main Area */
    main {
      flex: 1;
      padding: 36px 40px;
      max-width: 800px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .quiz-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px;
    }

    /* Progress Bar */
    .progress-bar-container {
      background: #0f172a;
      border-radius: 10px;
      height: 8px;
      width: 100%;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      background: #38bdf8;
      height: 100%;
      width: 10%;
      transition: width 0.3s;
    }

    .question-badge {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .question-title {
      font-size: 19px;
      margin-bottom: 24px;
      line-height: 1.5;
      color: #f8fafc;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 14px 18px;
      border-radius: 8px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: #38bdf8;
      background: #1e293b;
    }

    .option-btn.correct {
      border-color: #22c55e !important;
      background: #22c55e22 !important;
      color: #22c55e !important;
      font-weight: bold;
    }

    .option-btn.wrong {
      border-color: #ef4444 !important;
      background: #ef444422 !important;
      color: #ef4444 !important;
      font-weight: bold;
    }

    .explanation-box {
      display: none;
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 14px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .btn-next {
      display: none;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      transition: opacity 0.2s;
    }

    .btn-next:hover {
      opacity: 0.9;
    }

    /* Score Result Screen */
    #scoreScreen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    #scoreScreen h2 {
      font-size: 28px;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    #scoreScreen p {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: #38bdf8;
      margin: 0 auto 20px;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .btn-link {
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <aside>
    <div class="brand">QuickLearn AI</div>
    <nav>
      <a href="dashboard.html">📊 Overview</a>
      <a href="upload.html">📤 Upload Notes</a>
      <a href="quiz.html" class="active">📝 AI Quiz</a>
      <a href="flashcards.html">⚡ Flashcards</a>
    </nav>
    <a href="index.html" class="logout-btn">Log Out</a>
  </aside>

  <main>
    <h1>AI-Generated Practice Quiz</h1>
    <p class="subtitle">10 multiple-choice questions to test your understanding</p>

    <div class="quiz-card" id="quizContainer">
      <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="question-badge" id="questionCounter">Question 1 of 10</div>
      <div class="question-title" id="questionText">Loading question...</div>

      <div class="options-grid" id="optionsContainer"></div>

      <div class="explanation-box" id="explanationText"></div>

      <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <!-- Final Score Display -->
    <div class="quiz-card" id="scoreScreen">
      <div class="score-circle" id="scoreCircle">0/10</div>
      <h2>Great Effort! 🎉</h2>
      <p id="scoreSummary">You have completed the full quiz.</p>
      
      <div class="action-row">
        <button class="btn-link" onclick="restartQuiz()">Retake Quiz</button>
        <a href="flashcards.html" class="btn-link" style="background:#0f172a; color:#38bdf8; border:1px solid #38bdf8;">Study Flashcards →</a>
      </div>
    </div>
  </main>

  <script>
    const questions = [
      {
        q: "What does the 'A' represent in the ACID transaction properties?",
        opts: ["Availability", "Atomicity", "Accuracy", "Authentication"],
        correct: 1,
        exp: "Atomicity ensures that all statements in a transaction execute completely or roll back entirely."
      },
      {
        q: "Which normal form removes partial dependency on a composite key?",
        opts: ["First Normal Form (1NF)", "Second Normal Form (2NF)", "Third Normal Form (3NF)", "Boyce-Codd Normal Form (BCNF)"],
        correct: 1,
        exp: "2NF eliminates partial dependency by ensuring all non-key attributes depend on the entire primary key."
      },
      {
        q: "What is the average search time complexity of a balanced Binary Search Tree (BST)?",
        opts: ["O(1)", "O(n)", "O(log n)", "O(n log n)"],
        correct: 2,
        exp: "Because the search space is halved at each step, balanced BST operations take O(log n) time."
      },
      {
        q: "What happens during a race condition in process concurrency?",
        opts: ["Processes run sequentially", "Multiple threads access shared data concurrently without synchronization", "Memory runs out completely", "All processes terminate"],
        correct: 1,
        exp: "A race condition occurs when concurrent processes read/write shared data without proper mutual exclusion."
      },
      {
        q: "Which ACID property ensures committed data survives unexpected power loss or crashes?",
        opts: ["Consistency", "Durability", "Isolation", "Atomicity"],
        correct: 1,
        exp: "Durability guarantees that once a transaction commits, its state is written to non-volatile storage."
      },
      {
        q: "Which data structure operates on a Last-In, First-Out (LIFO) basis?",
        opts: ["Queue", "Stack", "Binary Tree", "Graph"],
        correct: 1,
        exp: "A Stack operates on LIFO (used in function call stacks and undo mechanisms)."
      },
      {
        q: "Which SQL clause is used to filter records after aggregation with GROUP BY?",
        opts: ["WHERE", "ORDER BY", "HAVING", "LIMIT"],
        correct: 2,
        exp: "HAVING filters aggregated grouped results, whereas WHERE filters individual rows before grouping."
      },
      {
        q: "What is mutual exclusion in Operating Systems?",
        opts: ["Only one process can execute in its critical section at a time", "All processes run simultaneously", "Memory is divided equally", "Threads share all variables"],
        correct: 0,
        exp: "Mutual exclusion ensures that no two processes can enter their critical section at the same time."
      },
      {
        q: "What uniquely identifies each record in a relational database table?",
        opts: ["Foreign Key", "Index Key", "Primary Key", "Composite Column"],
        correct: 2,
        exp: "A primary key uniquely identifies every row (tuple) in a relational table."
      },
      {
        q: "Which tree self-balances its height using tree rotations?",
        opts: ["Skewed Tree", "Trie", "AVL Tree", "Array Tree"],
        correct: 2,
        exp: "AVL trees perform left and right rotations to maintain a height balance factor between -1 and +1."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      answered = false;
      const q = questions[currentQuestion];

      document.getElementById('questionCounter').innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
      document.getElementById('questionText').innerText = q.q;
      document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('explanationText').style.display = 'none';

      const container = document.getElementById('optionsContainer');
      container.innerHTML = "";

      q.opts.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx, btn);
        container.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, btnElement) {
      if (answered) return;
      answered = true;

      const q = questions[currentQuestion];
      const buttons = document.querySelectorAll('.option-btn');

      if (selectedIndex === q.correct) {
        btnElement.classList.add('correct');
        score++;
      } else {
        btnElement.classList.add('wrong');
        buttons[q.correct].classList.add('correct');
      }

      const expBox = document.getElementById('explanationText');
      expBox.innerText = `💡 Explanation: ${q.exp}`;
      expBox.style.display = 'block';

      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quizContainer').style.display = 'none';
      const scoreScreen = document.getElementById('scoreScreen');
      scoreScreen.style.display = 'block';
      document.getElementById('scoreCircle').innerText = `${score}/${questions.length}`;
      document.getElementById('scoreSummary').innerText = `You scored ${score} out of ${questions.length} (${Math.round((score / questions.length) * 100)}%)!`;

      // Save incremented completion count to localStorage
      let currentCompleted = parseInt(localStorage.getItem("quizCompleted") || "0");
      localStorage.setItem("quizCompleted", currentCompleted + 1);
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      document.getElementById('scoreScreen').style.display = 'none';
      document.getElementById('quizContainer').style.display = 'block';
      renderQuestion();
    }

    renderQuestion();
  </script>

</body>
</html>
